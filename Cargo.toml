[workspace]
members = ["crates/aix-core", "crates/aix-runtime", "crates/aix-permission", "crates/aix-connector"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
