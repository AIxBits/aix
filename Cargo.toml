[workspace]
members = ["apps/desktop/src-tauri", "crates/aix-authoring", "crates/aix-core", "crates/aix-runtime", "crates/aix-permission", "crates/aix-connector"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
jsonschema = { version = "0.56", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
